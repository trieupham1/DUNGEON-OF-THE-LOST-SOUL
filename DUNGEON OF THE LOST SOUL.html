<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon of the Lost Soul</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #07050b; font-family: Cambria, 'Palatino Linotype', 'Times New Roman', 'Noto Serif', 'DejaVu Serif', serif; color: #e8dcc0; }
canvas#game { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); cursor: crosshair; }

.overlay {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  background: radial-gradient(ellipse at center, rgba(40,10,30,.85), rgba(0,0,0,.95));
  z-index: 10; text-align: center;
}
.overlay.hidden { display: none; }
h1 { font-size: clamp(32px, 6vw, 72px); letter-spacing: 6px; color: #d4a937; text-shadow: 0 0 20px #7a1a2e, 0 4px 0 #000; line-height: 1.1; }
h2 { font-size: 48px; letter-spacing: 6px; color: #c9b27a; text-shadow: 0 0 14px #5b2a8a; }
h2.red { color: #c0283c; text-shadow: 0 0 18px #7a1a2e; }
h2.gold { color: #f0c64a; text-shadow: 0 0 18px #b8860b; }
button {
  min-width: 240px; padding: 12px 28px; font: inherit; font-size: 20px; letter-spacing: 3px; color: #e8dcc0;
  background: linear-gradient(#2a1630, #14091a); border: 2px solid #8a6d2b; border-radius: 4px; cursor: pointer;
  transition: transform .12s, box-shadow .12s, background .12s;
}
button:hover { background: linear-gradient(#4a1a2e, #24101c); box-shadow: 0 0 18px #7a1a2e; transform: scale(1.05); }
button:active { transform: scale(.97); }
/* Hàng nút nhỏ (MUSIC / SFX) */
.btn-row { display: flex; gap: 12px; }
.btn-row .btn-sm, .btn-lang { min-width: 150px; font-size: 15px; padding: 9px 16px; letter-spacing: 2px; }
.btn-row .btn-sm.off { opacity: .5; }
.btn-lang { min-width: 240px; margin-top: -6px; }
.btn-lang:hover { box-shadow: 0 0 18px #4a6ad0; }
/* Nút quay lại (màn chọn class): phụ, không nổi bật bằng nút START */
#btn-select-back { min-width: 240px; font-size: 16px; padding: 9px 28px; letter-spacing: 2px; opacity: .8; margin-top: -6px; }
#btn-select-back:hover { opacity: 1; }
#btn-start { font-weight: bold; box-shadow: 0 0 20px rgba(212,169,55,.25); }
/* Thẻ class: dòng vai trò + dòng chỉ số */
.hero span i { display: block; font-style: normal; color: #d09cff; letter-spacing: 1px; }
.hero span em { display: block; font-style: normal; color: #9fe0c0; font-size: 13px; margin: 2px 0; }
.hint, #stats { color: #9a8f78; font-size: 15px; line-height: 1.8; white-space: pre-line; }

/* ===== Inventory (dùng hết không gian, cân bằng 2 cột) ===== */
.inv-wrap { display: flex; gap: 26px; padding: 18px 22px; background: #0e0814; border: 2px solid #8a6d2b; border-radius: 6px; text-align: left; }
.inv-wrap h3 { color: #d4a937; letter-spacing: 2.5px; margin-bottom: 10px; font-size: 18px; }
.inv-wrap h3.mt { margin-top: 16px; }
.inv-wrap h4 { color: #6ac0ff; letter-spacing: 2px; margin-bottom: 6px; font-size: 13px; }
.inv-wrap small { color: #c9b27a; letter-spacing: 0; margin-left: 8px; font-size: 15px; }
#equip { display: grid; grid-template-columns: repeat(2, 62px); gap: 8px; }
#grid { display: grid; grid-template-columns: repeat(8, 62px); gap: 6px; max-height: 350px; overflow-y: auto; overflow-x: hidden; padding-right: 4px; scrollbar-width: thin; scrollbar-color: #5a3a7a #1a0f22; }
#grid::-webkit-scrollbar { width: 6px; }
#grid::-webkit-scrollbar-track { background: #1a0f22; border-radius: 3px; }
#grid::-webkit-scrollbar-thumb { background: #5a3a7a; border-radius: 3px; }
#grid::-webkit-scrollbar-thumb:hover { background: #7a4aa0; }
/* Chỉ số nhân vật: lưới 2 cột cho gọn và cân bằng chiều cao 2 cột */
#pstats { margin-top: 2px; display: grid; grid-template-columns: repeat(2, max-content); gap: 5px 22px;
  font-size: 15px; color: #c9b27a; align-content: start; }
#pstats b { color: #f0e8d8; font-weight: normal; }
#pstats .lb { color: #8a7a5a; }
/* --- Thanh công cụ sort / lọc inventory: 2 hàng gọn --- */
#inv-tools { margin: 6px 0 10px; }
.inv-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
.inv-label { font-size: 12px; letter-spacing: 1.5px; color: #8a7a5a; width: 44px; flex: none; }
.inv-note { font-size: 13px; color: #d4a937; margin-left: 8px; letter-spacing: .5px; }
.inv-btn { font: inherit; font-size: 13px; letter-spacing: .5px; padding: 4px 10px; cursor: pointer; min-width: 32px;
  background: #1c1024; color: #b8a88a; border: 1px solid #4a3a5a; border-radius: 3px; transition: all .12s; }
.inv-btn:hover { color: #ffe08a; border-color: #8a6d2b; }
.inv-btn.on { background: #3a2a1a; color: #ffd24a; border-color: #d4a937; box-shadow: 0 0 6px rgba(212,169,55,.35); }
/* Nút lọc tier: tô màu theo độ hiếm để nhận biết nhanh */
.inv-filter[data-tier="0"] { border-bottom: 2px solid #b8b8b8; }
.inv-filter[data-tier="1"] { border-bottom: 2px solid #4fd05a; }
.inv-filter[data-tier="2"] { border-bottom: 2px solid #4a8aff; }
.inv-filter[data-tier="3"] { border-bottom: 2px solid #b05cff; }
.inv-filter[data-tier="4"] { border-bottom: 2px solid #ffb02e; }
/* Ô đang được kéo / thả */
.slot.drag { opacity: .35; }
.slot.over { outline: 2px solid #6fe0a0; box-shadow: 0 0 10px rgba(111,224,160,.5); }
/* Item bị lọc bởi bộ lọc tier: mờ đi nhưng vẫn giữ nguyên vị trí trong túi */
.slot.dim { opacity: .18; filter: grayscale(1); }
.slot.dim:hover { opacity: .55; filter: grayscale(.5); }
.slot { width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; font-size: 30px; position: relative; background: #14091a; border: 2px solid #3a2a4a; border-radius: 4px; cursor: pointer; transition: transform .1s; }
.slot:hover { transform: scale(1.08); }
.slot.ph { font-size: 12px; color: #6a5a7a; text-transform: uppercase; letter-spacing: .5px; }
.slot.sel { outline: 2px solid #f0c64a; }
.slot span { position: absolute; right: 2px; bottom: 0; font-size: 11px; color: #fff; }
/* Ô đang làm "đồ tham chiếu" để so sánh: viền đậm + nhãn A */
.slot.cmp { outline: 2px dashed #6ac0ff; box-shadow: 0 0 10px rgba(106,192,255,.45); }
.slot.cmp::after { content: 'A'; position: absolute; left: 1px; top: 0; font-size: 9px; font-weight: bold; color: #6ac0ff; text-shadow: 0 0 3px #000; }
#actions { margin-top: 8px; display: flex; gap: 6px; min-height: 28px; flex-wrap: wrap; }
#actions button { min-width: 0; font-size: 12px; padding: 4px 10px; letter-spacing: 1px; }
#actions .cmp-clear { background: #16243a; color: #9fd0ff; border: 1px solid #3a5f8a; border-radius: 3px; cursor: pointer; }
#actions .cmp-clear:hover { background: #1e3252; color: #fff; }
/* Hướng dẫn dưới khung inventory: chữ to hơn vì panel đã rút gọn */
#inv > .hint { font-size: 13px; line-height: 1.7; color: #9a8f78; opacity: .85; }
/* --- Khung COMPARE: lấp khoảng trống bên dưới lưới túi --- */
#cmpbox { margin-top: 10px; padding: 8px 12px; background: #0c0714; border: 1px solid #2a3a5a; border-radius: 4px; min-height: 62px; }
#cmp-body { font-size: 13px; line-height: 1.5; color: #9a8f78; }
#cmp-body .cd-row { display: flex; gap: 8px; white-space: nowrap; }
#cmp-body .cd-row .k { flex: 1; color: #9a8f78; }
#cmp-body .cd-row .v { color: #e8dcc0; }
#cmp-body .cd-head { color: #6ac0ff; margin-bottom: 4px; }

/* ===== Toast: thông báo góc phải (mua/bán/nhặt/đạt cấp) ===== */
#toasts { position: fixed; top: 14px; right: 14px; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; max-width: 300px; }
.toast { padding: 7px 13px; background: rgba(14,8,20,.94); border: 1px solid #8a6d2b; border-left-width: 3px; border-radius: 4px;
  font-size: 13px; line-height: 1.35; color: #f0e8d8; box-shadow: 0 2px 14px rgba(0,0,0,.7); animation: toast-in .22s ease-out; white-space: nowrap; }
.toast.out { animation: toast-out .35s ease-in forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateX(28px); } }
#tip { position: fixed; z-index: 40; pointer-events: none; min-width: 230px; max-width: 360px; padding: 11px 13px; background: #0c0710; border: 1px solid #8a6d2b; border-radius: 4px; font-size: 14px; line-height: 1.6; box-shadow: 0 0 14px #000; }
#tip.hidden { display: none; }
/* --- Bảng so sánh đồ (compare) trong tooltip --- */
.cmp-hd { margin: 6px 0 4px; padding-top: 5px; border-top: 1px solid #3a2a4a; font-size: 10px; letter-spacing: 1px; color: #6ac0ff; }
.cmp-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.cmp-row .k { flex: 1; color: #9a8f78; }
.cmp-row .v { color: #e8dcc0; min-width: 34px; text-align: right; }
.cmp-row .d { min-width: 46px; text-align: right; font-size: 11px; }
.cmp-up { color: #6fe07a; }     /* tốt hơn */
.cmp-dn { color: #ff7070; }     /* kém hơn */
.cmp-eq { color: #7a6a8a; }     /* bằng nhau */
/* Verdict tổng kết: đồ này tốt hơn hay kém hơn đồ tham chiếu */
.cmp-note { margin-top: 6px; padding-top: 5px; border-top: 1px solid #3a2a4a; font-size: 12px; font-weight: bold; }

/* ===== Hero select ===== */
.heroes { display: flex; gap: 20px; }
.hero { width: 230px; padding: 18px 12px; background: linear-gradient(#1e0f26, #10081a); border: 2px solid #3a2a4a; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: transform .12s, box-shadow .12s; }
.hero:hover { transform: translateY(-4px); box-shadow: 0 0 18px #5b2a8a; }
.hero.sel { border-color: #d4a937; box-shadow: 0 0 20px #7a1a2e; }
.hero .ico { font-size: 44px; } .hero b { color: #d4a937; letter-spacing: 3px; } .hero span { color: #9a8f78; font-size: 13px; line-height: 1.7; }
/* Canvas xem trước nhân vật (vẽ bằng chính Player.draw) */
.hero-prev { width: 96px; height: 132px; margin: 0 auto; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 78%, rgba(120,80,160,.28), transparent 68%); border-radius: 5px; }
.hero-prev canvas { width: 96px; height: 132px; display: block; image-rendering: auto; }
.hero.sel .hero-prev { background: radial-gradient(ellipse at 50% 78%, rgba(212,169,55,.34), transparent 68%); }


/* ===== Milestone 7: Shop / Quest / Event panel ===== */
.panel-wrap { width: min(620px, 92vw); max-height: 78vh; overflow:auto; padding: 26px; background: linear-gradient(145deg,#12091a,#08060c); border: 2px solid #8a6d2b; border-radius: 8px; box-shadow: 0 0 35px rgba(0,0,0,.8), inset 0 0 30px rgba(100,40,130,.12); }
.panel-wrap h2 { margin-bottom: 16px; }
.panel-body { color:#c9b27a; font-size:16px; line-height:1.7; text-align:left; }
.panel-body p { margin: 8px 0; }
.panel-gold { text-align:center; color:#ffd24a; font-size:18px; }
.shop-list { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
.shop-heading { color:#d4a937; border-bottom:1px solid #3a2a4a; padding-bottom:5px; margin-top:18px; letter-spacing:2px; font-size:14px; }
.shop-row { display:flex; align-items:center; justify-content:space-between; gap:15px; padding:10px 12px; background:#160c20; border:1px solid #3a2a4a; border-radius:4px; }
.shop-row b { color:#e8dcc0; display:block; }
.shop-row small { color:#ffd24a; }
.shop-row button { min-width:90px; width:90px; padding:7px 10px; font-size:14px; letter-spacing:1px; }
.panel-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:20px; }
.panel-actions button { min-width:150px; font-size:15px; padding:9px 16px; }
.quest-complete { color:#6fe0a0; font-weight:bold; }


/* ===== Milestone 8: Boss ===== */
.boss-reward { color:#ffcf55; font-weight:bold; letter-spacing:1px; }
#victory h2.gold { text-shadow: 0 0 18px #b05cff, 0 0 32px #ff304f; }


/* ===== Milestone 9: Save / Audio / Polish ===== */
#menu button { min-width: 260px; }
#btn-continue { border-color:#6a4aa0; }
#btn-audio { min-width:180px; font-size:14px; letter-spacing:2px; }
#btn-save { border-color:#4a8a6d; }
.boss-reward { animation: rewardPulse 1.8s ease-in-out infinite; }
@keyframes rewardPulse { 0%,100%{text-shadow:0 0 4px #b8860b;} 50%{text-shadow:0 0 18px #ffcf55;} }


/* ===== Milestone 10: Story / Achievements / Endings ===== */
#btn-achievements, #btn-achievements-pause { border-color:#3a718a; }
.achievement-list { display:flex; flex-direction:column; gap:7px; margin-top:14px; max-height:360px; overflow:auto; }
.achievement-row { display:flex; flex-direction:column; gap:3px; padding:10px 12px; background:#120c19; border:1px solid #332744; border-radius:4px; opacity:.58; }
.achievement-row.unlocked { opacity:1; border-color:#8a6d2b; background:#1b1220; }
.achievement-row b { color:#d4a937; }
.achievement-row small { color:#9a8f78; }
.ending-stats { color:#78d8ff !important; text-align:center; }
#panel-close { position:absolute; right:14px; top:10px; min-width:0; width:38px; padding:3px 8px; font-size:24px; line-height:1; border-color:#56347a; }
.panel-wrap { position:relative; }


/* ===== Graphics upgrade: menu & UI polish ===== */
#menu { background: radial-gradient(ellipse at 50% 120%, rgba(150,35,45,.55), transparent 60%), radial-gradient(ellipse at center, rgba(40,10,40,.9), rgba(0,0,0,.97)); overflow: hidden; }
#menu::before { content: ''; position: absolute; inset: -40% 0 0 0; pointer-events: none; opacity: .75; animation: embers 10s linear infinite;
  background-image: radial-gradient(2px 2px at 8% 70%, #ff9a40, transparent), radial-gradient(2px 2px at 22% 40%, #ffd060, transparent), radial-gradient(1.5px 1.5px at 35% 85%, #ff7a30, transparent), radial-gradient(2px 2px at 48% 55%, #ffb050, transparent),
  radial-gradient(1.5px 1.5px at 61% 78%, #ff9a40, transparent), radial-gradient(2px 2px at 74% 35%, #ffd060, transparent), radial-gradient(1.5px 1.5px at 86% 65%, #ff7a30, transparent), radial-gradient(2px 2px at 94% 90%, #ffb050, transparent); }
@keyframes embers { from { transform: translateY(35%); } to { transform: translateY(-35%); } }
#menu > * { position: relative; z-index: 1; }
#menu h1 { animation: titleGlow 3s ease-in-out infinite; }
@keyframes titleGlow { 0%, 100% { text-shadow: 0 0 18px #7a1a2e, 0 4px 0 #000; } 50% { text-shadow: 0 0 42px #c0283c, 0 0 12px #d4a937, 0 4px 0 #000; } }
button { position: relative; overflow: hidden; }
button::after { content: ''; position: absolute; top: 0; left: -120%; width: 60%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.2), transparent); transition: left .5s; }
button:hover::after { left: 140%; }
.hero:hover .ico { animation: heroBob .6s ease-in-out infinite alternate; }
@keyframes heroBob { to { transform: translateY(-5px) scale(1.12); } }
.overlay { animation: fadeIn .25s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }


/* ===== Item icons (vẽ bằng Canvas) ===== */
.slot img { width: 40px; height: 40px; pointer-events: none; user-select: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.7)); }
.slot.ph img { width: 34px; height: 34px; margin-top: -7px; }
.slot .lbl { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 9px; letter-spacing: .5px; color: #8a7a9a; text-transform: uppercase; }
.shop-ico { width: 40px; height: 40px; flex: none; }
.shop-name { flex: 1; text-align: left; }
.shop-name b, .shop-name small { display: block; }
.sell-row { border-color:#315a4b; }


/* ===== Endless 30 floors: save slots / records / victory ===== */
.slot-list { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; min-width: 420px; }
.slot-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: rgba(20,12,32,.85); border: 1px solid #5a4a2b; border-radius: 8px; }
.slot-row.empty { opacity: .55; }
.slot-info { flex: 1; text-align: left; font-size: 13px; line-height: 1.55; }
.slot-btn { min-width: 96px; padding: 8px 12px; font-size: 12px; }
.slot-del { padding: 6px 10px; font-size: 13px; border-color: #6a3040; }
.slot-del:hover { background: #4a1a26; }
#records-body { min-width: 460px; max-width: 620px; }
.rec-best { text-align: center; padding: 16px 10px; margin-bottom: 12px; background: linear-gradient(180deg, rgba(60,40,10,.6), rgba(20,12,32,.85)); border: 1px solid #8a6d2b; border-radius: 10px; }
.rec-big { font: bold 64px Cambria, Georgia, serif; color: #ffd24a; line-height: 1; text-shadow: 0 3px 14px rgba(255,180,40,.45); }
.rec-big span { font-size: 26px; color: #8a7a5a; }
.rec-lbl { font-size: 11px; letter-spacing: 3px; color: #9a8f78; margin-top: 6px; }
.rec-sub { font-size: 13px; color: #e8dcc0; margin-top: 8px; line-height: 1.6; }
.rec-h { font-size: 13px; letter-spacing: 3px; color: #9a8f78; margin: 14px 0 8px; }
.rec-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.rec-table th { font-size: 10px; letter-spacing: 1.5px; color: #9a8f78; border-bottom: 1px solid #5a4a2b; padding: 6px 4px; }
.rec-table td { padding: 6px 4px; border-bottom: 1px solid rgba(90,74,43,.35); text-align: center; }
.rec-table tr.win td { color: #ffd24a; }
.win-stats { margin: 14px 0; }
.win-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
.win-item { background: rgba(20,12,32,.85); border: 1px solid #5a4a2b; border-radius: 8px; padding: 10px 6px; text-align: center; }
.win-item span { display: block; font-size: 10px; letter-spacing: 1.5px; color: #9a8f78; text-transform: uppercase; }
.win-item b { display: block; font-size: 19px; color: #ffd24a; margin-top: 4px; }
.win-new { font-size: 15px; letter-spacing: 3px; color: #6fe0a0; animation: pulseGlow 1.2s ease-in-out infinite; }
@keyframes pulseGlow { 50% { opacity: .55; } }
.go-row { display: flex; justify-content: space-between; gap: 20px; padding: 6px 2px; border-bottom: 1px solid rgba(90,74,43,.35); font-size: 14px; color: #e8dcc0; }
.go-row b { color: #ffd24a; }
#btn-diff { min-width: 300px; font-size: 14px; letter-spacing: 2px; }

/* ===== Skill Guide ===== */
.sg-wrap { min-width: 520px; max-width: 640px; text-align: left; }
.sg-head { font: bold 22px Cambria, Georgia, serif; color: var(--sg); letter-spacing: 3px; border-bottom: 2px solid var(--sg); padding-bottom: 6px; margin-bottom: 12px; }
.sg-head small { font: 12px Cambria, Georgia, serif; color: #9a8f78; letter-spacing: 0; display: block; margin-top: 4px; }
.sg-stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 16px; }
.sg-stat { background: rgba(20,12,32,.85); border: 1px solid #5a4a2b; border-radius: 6px; padding: 7px 2px; text-align: center; }
.sg-stat span { display: block; font-size: 9px; letter-spacing: 1px; color: #9a8f78; }
.sg-stat b { display: block; font-size: 17px; color: #e8dcc0; margin-top: 3px; }
.sg-h { font-size: 11px; letter-spacing: 2.5px; color: #9a8f78; margin: 14px 0 8px; }
.sg-skills { display: flex; flex-direction: column; gap: 8px; }
.sg-skill { background: rgba(20,12,32,.85); border: 1px solid #5a4a2b; border-left: 3px solid var(--sg); border-radius: 6px; padding: 9px 12px; }
.sg-sk-head { display: flex; align-items: center; gap: 9px; }
.sg-key { display: inline-block; min-width: 52px; text-align: center; background: var(--sg); color: #1a0a04; font: bold 12px Cambria, serif; border-radius: 4px; padding: 3px 5px; }
.sg-sk-head b { font-size: 15px; color: #e8dcc0; }
.sg-sk-meta { display: flex; gap: 14px; font-size: 10px; color: #8a7f68; margin: 5px 0 4px 61px; letter-spacing: 1px; }
.sg-sk-desc { font-size: 12.5px; color: #b8ac94; line-height: 1.55; margin-left: 61px; }
.sg-tips { margin: 0; padding-left: 20px; }
.sg-tips li { font-size: 12.5px; color: #b8ac94; line-height: 1.7; }
.sg-keys { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; }
.sg-keys span { font-size: 12px; color: #b8ac94; }
.sg-keys b { display: inline-block; min-width: 78px; color: var(--sg); }

</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- Màn hình loading: chờ CrazyGames SDK init() + nạp dữ liệu người chơi -->
<div id="boot" class="overlay">
  <h1>DUNGEON OF<br>THE LOST SOUL</h1>
  <p class="hint" id="boot-msg" data-i18n="loading"></p>
</div>

<div id="menu" class="overlay hidden">
  <h1>DUNGEON OF<br>THE LOST SOUL</h1>
  <button id="btn-play" data-i18n="play"></button>
  <button id="btn-load" data-i18n="cont"></button>
  <button id="btn-audio"></button>
  <div class="btn-row">
    <button id="btn-music" class="btn-sm"></button>
    <button id="btn-sfx" class="btn-sm"></button>
  </div>
  <button id="btn-lang" class="btn-sm btn-lang"></button>
  <button id="btn-achievements" data-i18n="ach"></button>
  <button id="btn-records" data-i18n="records"></button>
  <p class="hint" data-i18n="menuHint"></p>
</div>

<div id="select" class="overlay hidden">
  <h2 data-i18n="chooseHero"></h2>
  <div class="heroes">
    <div class="hero sel" data-cls="knight"><div class="hero-prev"><canvas width="96" height="132" data-prev="knight"></canvas></div><b data-i18n="knight"></b><span><i data-i18n="tankMelee"></i><br><em id="st-knight"></em><br>Q Shield Bash · E Whirlwind · R Guardian</span></div>
    <div class="hero" data-cls="archer"><div class="hero-prev"><canvas width="96" height="132" data-prev="archer"></canvas></div><b data-i18n="archer"></b><span><i data-i18n="rangedDps"></i><br><em id="st-archer"></em><br>Q Multi Shot · E Piercing Arrow · R Rain of Arrows</span></div>
    <div class="hero" data-cls="mage"><div class="hero-prev"><canvas width="96" height="132" data-prev="mage"></canvas></div><b data-i18n="mage"></b><span><i data-i18n="magicDps"></i><br><em id="st-mage"></em><br>Q Fireball · E Frost Nova · R Meteor</span></div>
  </div>
  <button id="btn-diff"></button>
  <button id="btn-skillguide" data-i18n="skillGuide"></button>
  <button id="btn-start" data-i18n="start"></button>
  <button id="btn-select-back" data-i18n="mainMenu"></button>
</div>

<div id="pause" class="overlay hidden">
  <h2 data-i18n="paused"></h2>
  <button id="btn-resume" data-i18n="resume"></button>
  <button id="btn-save" data-i18n="saveGame"></button>
  <button id="btn-guide-pause" data-i18n="skillGuide"></button>
  <button id="btn-achievements-pause" data-i18n="ach"></button>
  <button id="btn-menu1" data-i18n="mainMenu"></button>
</div>

<!-- Bảng chọn slot save (3 slot) -->
<div id="slots" class="overlay hidden">
  <h2 data-i18n="saveSlots"></h2>
  <div id="slot-list" class="slot-list"></div>
  <button id="btn-slot-back" data-i18n="back"></button>
</div>

<!-- Bảng xếp hạng / thông số tốt nhất -->
<div id="records" class="overlay hidden">
  <h2 data-i18n="records"></h2>
  <div id="records-body"></div>
  <button id="btn-records-back" data-i18n="back"></button>
</div>

<div id="gameover" class="overlay hidden">
  <h2 class="red" data-i18n="gameOver"></h2>
  <p id="stats"></p>
  <button id="btn-retry" data-i18n="retry"></button>
  <button id="btn-menu2" data-i18n="mainMenu"></button>
</div>

<div id="victory" class="overlay hidden">
  <h2 class="gold" data-i18n="floorCleared"></h2>
  <p data-i18n="victoryTxt"></p>
  <p class="boss-reward" data-i18n="finalReward"></p>
  <div id="victory-stats" class="win-stats"></div>
  <button id="btn-again" data-i18n="playAgain"></button>
  <button id="btn-victory-records" data-i18n="records"></button>
</div>

<div id="inv" class="overlay hidden">
  <div class="inv-wrap">
    <div class="inv-left">
      <h3 data-i18n="equipped"></h3><div id="equip"></div>
      <h3 class="mt" data-i18n="stats"></h3><div id="pstats"></div>
    </div>
    <div class="inv-right">
      <h3><span data-i18n="inventory"></span> <small id="gold"></small></h3>
      <div id="inv-tools">
        <div class="inv-row">
          <span class="inv-label" data-i18n="sort"></span>
          <button class="inv-btn" data-sort="tier" title="Tier ↓">⬇Tier</button>
          <button class="inv-btn" data-sort="level" title="Level ↓">⬇Lv</button>
          <button class="inv-btn" data-sort="value" title="Value ↓">⬇Val</button>
          <button class="inv-btn" data-sort="slot" title="Slot">Slot</button>
        </div>
        <div class="inv-row">
          <span class="inv-label" data-i18n="tier"></span>
          <button class="inv-btn inv-filter" data-tier="all" data-i18n="all"></button>
          <button class="inv-btn inv-filter" data-tier="0">C</button>
          <button class="inv-btn inv-filter" data-tier="1">U</button>
          <button class="inv-btn inv-filter" data-tier="2">R</button>
          <button class="inv-btn inv-filter" data-tier="3">E</button>
          <button class="inv-btn inv-filter" data-tier="4">L</button>
          <span id="inv-note" class="inv-note"></span>
        </div>
      </div>
      <div id="grid"></div>
      <div id="cmpbox"><h4 data-i18n="compare"></h4><div id="cmp-body" data-i18n="compareHint"></div></div>
      <div id="actions"></div>
    </div>
  </div>
  <p class="hint" data-i18n="invHint"></p>
</div>

<div id="panel" class="overlay hidden">
  <div class="panel-wrap">
    <button id="panel-close" class="panel-close" type="button" aria-label="Close">×</button>
    <h2 id="panel-title">NPC</h2>
    <div id="panel-body" class="panel-body"></div>
    <div id="panel-actions" class="panel-actions"></div>
  </div>
  <p class="hint" data-i18n="esc"></p>
</div>
<div id="toasts"></div> <!-- thông báo góc phải: mua/bán/đạt cấp... -->
<div id="tip" class="hidden"></div>
